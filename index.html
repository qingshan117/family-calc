<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家庭风险诊断器</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:#f5f7fb;
    color:#111827;
    line-height:1.6;
    padding:20px;
}

.container{
    max-width:760px;
    margin:0 auto;
}

.hero{
    background:linear-gradient(135deg,#ffffff 0%,#eef2ff 100%);
    border-radius:28px;
    padding:48px 32px;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
}

.hero h1{
    font-size:38px;
    font-weight:800;
    margin-bottom:12px;
}

.hero h2{
    font-size:20px;
    color:#374151;
    font-weight:500;
    margin-bottom:16px;
}

.hero p{
    color:#6b7280;
    font-size:15px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(15,23,42,.05);
    transition:.3s ease;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 40px rgba(15,23,42,.08);
}

.section-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
}

.grid{
    display:grid;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:14px;
    margin-bottom:8px;
    color:#374151;
}

input,
select{
    border:none;
    outline:none;
    background:#f3f5f9;
    border-radius:14px;
    padding:16px;
    font-size:15px;
    transition:.25s ease;
}

input:focus,
select:focus{
    background:#fff;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}

button{
    width:100%;
    border:none;
    background:#111827;
    color:#fff;
    padding:18px;
    border-radius:16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s ease;
}

button:hover{
    transform:translateY(-2px);
    background:#1f2937;
}

.result-area{
    display:none;
    animation:fadeIn .8s ease;
}

.result-main{
    text-align:center;
}

.result-main h3{
    font-size:20px;
    margin-bottom:20px;
}

.result-number{
    font-size:72px;
    font-weight:900;
    letter-spacing:-3px;
    margin-bottom:10px;
}

.result-sub{
    color:#6b7280;
}

.risk-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:10px 20px;
    border-radius:999px;
    color:#fff;
    font-weight:700;
    margin-top:18px;
}

.low{
    background:#16a34a;
}

.medium{
    background:#f59e0b;
}

.high{
    background:#dc2626;
}

.analysis-list li,
.suggestion-list li{
    margin-bottom:12px;
    color:#374151;
}

.scenario-box{
    background:#f8fafc;
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
}

.scenario-box h4{
    color:#6b7280;
    font-size:14px;
    margin-bottom:8px;
}

.scenario-box .big{
    font-size:30px;
    font-weight:800;
}

.scenario-box p{
    color:#6b7280;
    margin-top:8px;
    font-size:14px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    .hero{
        padding:36px 24px;
    }

    .hero h1{
        font-size:30px;
    }

    .result-number{
        font-size:56px;
    }

    .card{
        padding:22px;
    }
}

</style>
</head>

<body>

<div class="container">

    <section class="hero">
        <h1>家庭风险诊断器</h1>
        <h2>如果收入突然停止，你的家庭还能撑多久？</h2>
        <p>帮助普通家庭评估现金流安全感。</p>
    </section>

    <section class="card">

        <div class="section-title">家庭收入</div>

        <div class="grid">

            <div class="form-group">
                <label>本人月收入</label>
                <input type="number" id="selfIncome" placeholder="10000">
            </div>

            <div class="form-group">
                <label>配偶月收入</label>
                <input type="number" id="partnerIncome" placeholder="5000">
            </div>

            <div class="form-group">
                <label>其它收入</label>
                <input type="number" id="otherIncome" placeholder="2000">
            </div>

        </div>

    </section>

    <section class="card">

        <div class="section-title">每月支出</div>

        <div class="grid">

            <div class="form-group">
                <label>房贷</label>
                <input type="number" id="mortgage">
            </div>

            <div class="form-group">
                <label>车贷</label>
                <input type="number" id="carLoan">
            </div>

            <div class="form-group">
                <label>家庭日常开销</label>
                <input type="number" id="livingCost">
            </div>

            <div class="form-group">
                <label>其它固定支出</label>
                <input type="number" id="otherCost">
            </div>

        </div>

    </section>

    <section class="card">

        <div class="section-title">当前资产</div>

        <div class="grid">

            <div class="form-group">
                <label>活期存款</label>
                <input type="number" id="cash">
            </div>

            <div class="form-group">
                <label>可快速变现资产</label>
                <input type="number" id="liquidAssets">
            </div>

        </div>

    </section>

    <section class="card">

        <div class="section-title">风险选项</div>

        <div class="grid">

            <div class="form-group">
                <label>是否计划生孩子</label>
                <select id="babyPlan">
                    <option>否</option>
                    <option>是</option>
                </select>
            </div>

            <div class="form-group">
                <label>是否单收入家庭</label>
                <select id="singleIncome">
                    <option>否</option>
                    <option>是</option>
                </select>
            </div>

            <div class="form-group">
                <label>是否担心未来1年失业</label>
                <select id="layoffRisk">
                    <option>否</option>
                    <option>是</option>
                </select>
            </div>

        </div>

    </section>

    <section class="card">
        <button onclick="calculate()">开始诊断</button>
    </section>

    <div class="result-area" id="resultArea">

        <section class="card">

            <div class="result-main">

                <h3>你的家庭预计可维持</h3>

                <div class="result-number" id="resultNumber">
                    0个月
                </div>

                <div class="result-sub">
                    （在完全失去收入情况下）
                </div>

                <div class="risk-badge" id="riskBadge">
                    中等风险
                </div>

            </div>

        </section>

        <section class="card">

            <div class="section-title">家庭风险分析</div>

            <ul class="analysis-list" id="analysisList"></ul>

        </section>

        <section class="card">

            <div class="section-title">AI建议</div>

            <ul class="suggestion-list" id="suggestionList"></ul>

        </section>

        <section class="card">

            <div class="section-title">人生事件模拟</div>

            <div id="scenarioContent"></div>

        </section>

    </div>

</div>

<script>

function getValue(id){
    return Number(document.getElementById(id).value) || 0;
}

function calculate(){

    const selfIncome = getValue('selfIncome');
    const partnerIncome = getValue('partnerIncome');

    const mortgage = getValue('mortgage');
    const carLoan = getValue('carLoan');
    const livingCost = getValue('livingCost');
    const otherCost = getValue('otherCost');

    const cash = getValue('cash');
    const liquidAssets = getValue('liquidAssets');

    const babyPlan = document.getElementById('babyPlan').value;
    const singleIncome = document.getElementById('singleIncome').value;
    const layoffRisk = document.getElementById('layoffRisk').value;

    const monthlyExpense =
        mortgage +
        carLoan +
        livingCost +
        otherCost;

    const totalAssets =
        cash +
        liquidAssets;

    if(monthlyExpense <= 0){
        alert('请填写家庭日常开销');
        return;
    }

    const survivalMonths =
        (totalAssets / monthlyExpense).toFixed(1);

    document.getElementById('resultArea').style.display = 'block';

    animateNumber(survivalMonths);

    generateRiskLevel(survivalMonths);

    generateAnalysis(
        survivalMonths,
        mortgage,
        babyPlan,
        singleIncome,
        layoffRisk,
        selfIncome,
        partnerIncome
    );

    generateSuggestions(
        survivalMonths,
        babyPlan
    );

    generateScenarioSimulation(
        monthlyExpense,
        totalAssets
    );

    document.getElementById('resultArea').scrollIntoView({
        behavior:'smooth'
    });
}

function animateNumber(target){

    const resultNumber =
        document.getElementById('resultNumber');

    let current = 0;

    const increment = target / 40;

    const timer = setInterval(()=>{

        current += increment;

        if(current >= target){
            current = target;
            clearInterval(timer);
        }

        resultNumber.innerText =
            current.toFixed(1) + '个月';

    },20);
}

function generateRiskLevel(months){

    const riskBadge =
        document.getElementById('riskBadge');

    let level = '';
    let className = '';

    if(months >= 24){
        level = '低风险';
        className = 'low';
    }
    else if(months >= 12){
        level = '中等风险';
        className = 'medium';
    }
    else{
        level = '高风险';
        className = 'high';
    }

    riskBadge.innerText =
        '家庭风险等级：' + level;

    riskBadge.className =
        'risk-badge ' + className;
}

function generateAnalysis(
    survivalMonths,
    mortgage,
    babyPlan,
    singleIncome,
    layoffRisk,
    selfIncome,
    partnerIncome
){

    const analysisList =
        document.getElementById('analysisList');

    analysisList.innerHTML = '';

    const items = [];

    if(singleIncome === '是'){
        items.push('家庭收入来源较单一，一旦主要收入中断，整体现金流压力会明显增加。');
    }

    if(babyPlan === '是'){
        items.push('未来可能新增育儿、医疗与教育支出。');
    }

    if(mortgage > 5000){
        items.push('长期固定房贷压力较高。');
    }

    if(layoffRisk === '是'){
        items.push('当前对未来收入稳定性存在一定担忧。');
    }

    if(selfIncome > partnerIncome * 2){
        items.push('家庭收入结构明显依赖单一职业。');
    }

    if(survivalMonths < 12){
        items.push('当前家庭缓冲能力偏弱。');
    }

    if(survivalMonths >= 24){
        items.push('当前家庭具备一定抗风险能力。');
    }

    const summary =
        document.createElement('li');

    summary.style.fontWeight = '700';

    if(survivalMonths < 12){
        summary.innerText =
            '你现在的问题可能不是收入低，而是家庭缓冲空间偏小。';
    }
    else if(survivalMonths < 24){
        summary.innerText =
            '你的家庭目前处于“还能撑住，但不算轻松”的状态。';
    }
    else{
        summary.innerText =
            '你的家庭已经具备一定安全垫，但真正的安全感来自持续稳定现金流。';
    }

    analysisList.appendChild(summary);

    items.forEach(item=>{
        const li = document.createElement('li');
        li.innerText = item;
        analysisList.appendChild(li);
    });
}

function generateSuggestions(
    survivalMonths,
    babyPlan
){

    const suggestionList =
        document.getElementById('suggestionList');

    suggestionList.innerHTML = '';

    const suggestions = [];

    if(survivalMonths < 12){
        suggestions.push('建议优先建立12个月以上家庭现金储备。');
        suggestions.push('当前阶段建议控制大额消费与长期负债。');
    }

    if(survivalMonths >= 12){
        suggestions.push('建议逐步建立副收入来源。');
    }

    if(survivalMonths >= 24){
        suggestions.push('当前家庭具备一定缓冲能力，可以开始长期规划。');
    }

    if(babyPlan === '是'){
        suggestions.push('若计划生育，建议提前预留专项预算。');
    }

    suggestions.push('很多家庭真正的问题不是收入低，而是没有足够缓冲空间。');

    suggestions.forEach(item=>{
        const li = document.createElement('li');
        li.innerText = item;
        suggestionList.appendChild(li);
    });

}

function generateScenarioSimulation(
    monthlyExpense,
    totalAssets
){

    const scenarioContent =
        document.getElementById('scenarioContent');

    const childExpense =
        monthlyExpense + 3000;

    const childMonths =
        (totalAssets / childExpense).toFixed(1);

    const layoffMonths =
        (totalAssets / (monthlyExpense * 1.2)).toFixed(1);

    scenarioContent.innerHTML = `

        <div class="scenario-box">
            <h4>如果未来新增育儿支出</h4>
            <div class="big">${childMonths}个月</div>
            <p>家庭缓冲周期将明显缩短</p>
        </div>

        <div class="scenario-box">
            <h4>如果未来收入下降20%</h4>
            <div class="big">${layoffMonths}个月</div>
            <p>家庭现金流压力会进一步上升</p>
        </div>

    `;
}

</script>

</body>
</html>
