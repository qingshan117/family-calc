<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>普通家庭生存计算器</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:#f5f7fb;
    color:#111827;
    line-height:1.6;
    padding:24px;
}

.container{
    max-width:760px;
    margin:0 auto;
}

.hero{
    padding:48px 32px;
    border-radius:28px;
    background:linear-gradient(135deg,#ffffff 0%,#eef3ff 100%);
    box-shadow:
        0 10px 30px rgba(15,23,42,0.06),
        inset 0 1px 0 rgba(255,255,255,0.7);
    margin-bottom:28px;
}

.hero h1{
    font-size:40px;
    font-weight:700;
    margin-bottom:12px;
}

.hero h2{
    font-size:20px;
    color:#374151;
    font-weight:500;
    margin-bottom:16px;
}

.hero p{
    color:#6b7280;
    font-size:15px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(15,23,42,0.05);
    transition:all .3s ease;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 40px rgba(15,23,42,0.08);
}

.section-title{
    font-size:20px;
    margin-bottom:18px;
    font-weight:700;
}

.grid{
    display:grid;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    font-size:14px;
    color:#374151;
}

input,select{
    border:none;
    background:#f3f5f9;
    border-radius:14px;
    padding:16px;
    font-size:15px;
    transition:all .25s ease;
    outline:none;
}

input:focus,
select:focus{
    background:#fff;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
    border:1px solid rgba(99,102,241,.25);
}

button{
    width:100%;
    border:none;
    padding:18px;
    border-radius:16px;
    background:#111827;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:all .3s ease;
}

button:hover{
    transform:translateY(-2px);
    background:#1f2937;
    box-shadow:0 12px 24px rgba(17,24,39,.18);
}

.result-area{
    display:none;
    animation:fadeIn .8s ease forwards;
}

.result-main{
    text-align:center;
    padding:12px 0;
}

.result-main h3{
    font-size:20px;
    color:#374151;
    margin-bottom:18px;
}

.result-number{
    font-size:68px;
    font-weight:800;
    letter-spacing:-2px;
    margin-bottom:8px;
}

.result-sub{
    color:#6b7280;
}

.risk-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:10px 20px;
    border-radius:999px;
    color:#fff;
    font-weight:600;
    margin-top:18px;
}

.analysis-list,
.suggestion-list{
    padding-left:18px;
}

.analysis-list li,
.suggestion-list li{
    margin-bottom:10px;
    color:#374151;
}

.low{
    background:#16a34a;
}

.medium{
    background:#f59e0b;
}

.high{
    background:#dc2626;
}

.fade-up{
    animation:fadeUp .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(16px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    body{
        padding:16px;
    }

    .hero{
        padding:36px 24px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero h2{
        font-size:18px;
    }

    .card{
        padding:22px;
    }

    .result-number{
        font-size:54px;
    }
}
</style>
</head>

<body>

<div class="container">

    <section class="hero fade-up">
        <h1>普通家庭生存计算器</h1>
        <h2>如果收入突然停止，你的家庭还能撑多久？</h2>
        <p>帮助普通家庭评估现金流安全感。</p>
    </section>

    <section class="card fade-up">

        <div class="section-title">家庭收入</div>

        <div class="grid">
            <div class="form-group">
                <label>本人月收入</label>
                <input type="number" id="selfIncome" placeholder="10000">
            </div>

            <div class="form-group">
                <label>配偶月收入</label>
                <input type="number" id="partnerIncome" placeholder="5000">
            </div>

            <div class="form-group">
                <label>其它收入</label>
                <input type="number" id="otherIncome" placeholder="2000">
            </div>
        </div>

    </section>

    <section class="card fade-up">

        <div class="section-title">每月支出</div>

        <div class="grid">
            <div class="form-group">
                <label>房贷</label>
                <input type="number" id="mortgage">
            </div>

            <div class="form-group">
                <label>车贷</label>
                <input type="number" id="carLoan">
            </div>

            <div class="form-group">
                <label>家庭日常开销</label>
                <input type="number" id="livingCost">
            </div>

            <div class="form-group">
                <label>其它固定支出</label>
                <input type="number" id="otherCost">
            </div>
        </div>

    </section>

    <section class="card fade-up">

        <div class="section-title">当前资产</div>

        <div class="grid">
            <div class="form-group">
                <label>活期存款</label>
                <input type="number" id="cash">
            </div>

            <div class="form-group">
                <label>可快速变现资产</label>
                <input type="number" id="liquidAssets">
            </div>
        </div>

    </section>

    <section class="card fade-up">

        <div class="section-title">风险选项</div>

        <div class="grid">
            <div class="form-group">
                <label>是否计划生孩子</label>
                <select id="babyPlan">
                    <option>否</option>
                    <option>是</option>
                </select>
            </div>

            <div class="form-group">
                <label>是否单收入家庭</label>
                <select id="singleIncome">
                    <option>否</option>
                    <option>是</option>
                </select>
            </div>

            <div class="form-group">
                <label>是否担心未来1年失业</label>
                <select id="layoffRisk">
                    <option>否</option>
                    <option>是</option>
                </select>
            </div>
        </div>

    </section>

    <section class="card fade-up">
        <button onclick="calculate()">开始计算</button>
    </section>

    <div class="result-area" id="resultArea">

        <section class="card">

            <div class="result-main">
                <h3>你的家庭预计可维持</h3>

                <div class="result-number" id="resultNumber">
                    0个月
                </div>

                <div class="result-sub">
                    （在完全失去收入情况下）
                </div>

                <div class="risk-badge" id="riskBadge">
                    中等风险
                </div>
            </div>

        </section>

        <section class="card">

            <div class="section-title">风险分析</div>

            <ul class="analysis-list" id="analysisList"></ul>

        </section>

        <section class="card">

            <div class="section-title">AI建议</div>

            <ul class="suggestion-list" id="suggestionList"></ul>

        </section>

    </div>

</div>

<script>

function getValue(id){
    return Number(document.getElementById(id).value) || 0;
}

function calculate(){

    const mortgage = getValue('mortgage');
    const carLoan = getValue('carLoan');
    const livingCost = getValue('livingCost');
    const otherCost = getValue('otherCost');

    const cash = getValue('cash');
    const liquidAssets = getValue('liquidAssets');

    const babyPlan = document.getElementById('babyPlan').value;
    const singleIncome = document.getElementById('singleIncome').value;
    const layoffRisk = document.getElementById('layoffRisk').value;

    const monthlyExpense =
        mortgage +
        carLoan +
        livingCost +
        otherCost;

    const totalAssets =
        cash +
        liquidAssets;

    if(monthlyExpense <= 0){
        alert('请至少填写家庭日常开销');
        return;
    }

    const survivalMonths =
        (totalAssets / monthlyExpense).toFixed(1);

    const resultArea =
        document.getElementById('resultArea');

    resultArea.style.display = 'block';

    animateNumber(survivalMonths);

    const riskBadge =
        document.getElementById('riskBadge');

    let riskLevel = '';
    let riskClass = '';

    if(survivalMonths >= 24){
        riskLevel = '低风险';
        riskClass = 'low';
    }
    else if(survivalMonths >= 12){
        riskLevel = '中等风险';
        riskClass = 'medium';
    }
    else{
        riskLevel = '高风险';
        riskClass = 'high';
    }

    riskBadge.innerText = riskLevel;
    riskBadge.className = 'risk-badge ' + riskClass;

    generateAnalysis(
        survivalMonths,
        mortgage,
        babyPlan,
        singleIncome,
        layoffRisk
    );

    generateSuggestions(
        survivalMonths,
        babyPlan
    );

    resultArea.scrollIntoView({
        behavior:'smooth'
    });
}

function animateNumber(target){

    const resultNumber =
        document.getElementById('resultNumber');

    let current = 0;

    const increment =
        target / 40;

    const timer = setInterval(()=>{

        current += increment;

        if(current >= target){
            current = target;
            clearInterval(timer);
        }

        resultNumber.innerText =
            current.toFixed(1) + '个月';

    },20);
}

function generateAnalysis(
    survivalMonths,
    mortgage,
    babyPlan,
    singleIncome,
    layoffRisk
){

    const analysisList =
        document.getElementById('analysisList');

    analysisList.innerHTML = '';

    const items = [];

    if(singleIncome === '是'){
        items.push('家庭收入来源较单一。');
    }

    if(babyPlan === '是'){
        items.push('未来可能新增育儿支出。');
    }

    if(mortgage > 5000){
        items.push('长期固定负债压力较高。');
    }

    if(layoffRisk === '是'){
        items.push('当前对未来收入稳定性存在一定担忧。');
    }

    if(survivalMonths < 12){
        items.push('当前现金流缓冲能力偏弱。');
    }

    if(survivalMonths >= 24){
        items.push('当前家庭具有一定抗风险能力。');
    }

    items.forEach(item=>{
        const li = document.createElement('li');
        li.innerText = item;
        analysisList.appendChild(li);
    });
}

function generateSuggestions(
    survivalMonths,
    babyPlan
){

    const suggestionList =
        document.getElementById('suggestionList');

    suggestionList.innerHTML = '';

    const suggestions = [];

    if(survivalMonths < 12){
        suggestions.push('建议优先增加家庭现金储备。');
        suggestions.push('当前阶段建议控制大额消费。');
    }

    if(survivalMonths >= 12){
        suggestions.push('建议逐步建立副收入来源。');
    }

    if(survivalMonths >= 24){
        suggestions.push('当前家庭具有一定缓冲能力，可适度进行长期规划。');
    }

    if(babyPlan === '是'){
        suggestions.push('若计划生育，建议提前预留专项预算。');
    }

    suggestions.push('保持稳定现金流，比短期高收益更重要。');

    suggestions.forEach(item=>{
        const li = document.createElement('li');
        li.innerText = item;
        suggestionList.appendChild(li);
    });

}

</script>

</body>
</html>
